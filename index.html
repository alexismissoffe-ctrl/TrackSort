<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TRACKSORT - Subgenre Sorter</title>

  <!-- PWA & Mobile Standalone Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrackSort">
  <meta name="theme-color" content="#0d0e12">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deck: {
              bg: '#0c0d12',
              card: '#13151c',
              border: '#1f2330',
              borderHover: '#2d3345',
              subtle: '#8a91a5',
              green: '#1ed760'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      background-color: #0c0d12;
      padding-top: var(--sat);
      padding-bottom: calc(var(--sab) + 30px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .touch-press:active {
      transform: scale(0.97);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #232733;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col font-sans antialiased select-none">

  <!-- DJ Deck Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-deck-bg/95 backdrop-blur border-b border-deck-border px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
    <!-- Brand Title -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-deck-green/20 border border-deck-green/30 flex items-center justify-center text-deck-green shadow-lg">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-black tracking-wider text-white uppercase leading-none">TRACKSORT</h1>
          <span class="text-[9px] font-mono tracking-widest uppercase bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700">SUBGENRE SORTER</span>
        </div>
        <p class="text-[11px] text-slate-400 mt-0.5">Sort Liked Songs by Subgenres</p>
      </div>
    </div>

    <!-- Platform Selector & Sync Actions -->
    <div class="flex items-center flex-wrap gap-2.5">
      <div class="flex bg-slate-900 border border-deck-border rounded-xl p-0.5 text-xs font-semibold">
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-deck-green text-black shadow">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.65 14.65c-.2.3-.6.4-.9.2-2.4-1.5-5.5-1.8-9.1-1-.4.1-.7-.2-.8-.5-.1-.4.2-.7.5-.8 4-.9 7.4-.5 10.1 1.2.3.2.4.6.2.9zm1.3-2.9c-.3.4-.8.5-1.2.3-3-1.8-7.5-2.4-11-1.3-.5.1-1-.2-1.1-.6-.1-.5.2-1 .6-1.1 4.1-1.2 9.1-.6 12.4 1.5.5.3.6.8.3 1.2zm.1-3C14.5 8.9 8.2 8.7 4.8 9.7c-.6.2-1.2-.2-1.4-.7-.2-.6.2-1.2.7-1.4 4-1.2 10.9-1 15 1.5.5.3.7 1 .4 1.5-.2.5-.9.7-1.5.4z"/></svg>
          Spotify
        </button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-400 opacity-60 cursor-not-allowed">
          SoundCloud
        </button>
      </div>

      <button id="scanBtn" onclick="startLibraryScan()" class="touch-press px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-deck-border text-xs font-semibold text-white flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-deck-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span id="scanBtnText">Scan Library</span>
      </button>

      <button id="authBtn" onclick="toggleAuthModal()" class="touch-press px-3.5 py-1.5 rounded-xl bg-slate-900 border border-deck-border text-xs font-semibold text-white hover:border-slate-600 flex items-center gap-2">
        <span id="authDot" class="w-2 h-2 rounded-full bg-red-500"></span>
        <span id="authText">Connect Spotify</span>
      </button>
    </div>
  </header>

  <!-- Progress Bar Overlay (during library scan) -->
  <div id="progressContainer" class="hidden bg-slate-900 border-b border-deck-border px-4 py-2">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-slate-400 mb-1">
      <span id="progressStatus">Reading liked tracks...</span>
      <span id="progressPct" class="font-mono text-deck-green font-bold">0%</span>
    </div>
    <div class="max-w-7xl mx-auto w-full bg-slate-800 rounded-full h-1 overflow-hidden">
      <div id="progressBar" class="bg-deck-green h-full rounded-full transition-all duration-200" style="width: 0%"></div>
    </div>
  </div>

  <!-- Main Crate Grid -->
  <main class="flex-1 px-4 lg:px-8 py-6 max-w-7xl mx-auto w-full space-y-4">
    <!-- Batch Actions Subheader -->
    <div class="flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="text-slate-400 font-semibold uppercase tracking-wider text-[11px]">DJ Crate Deck</span>
        <span id="librarySummaryBadge" class="bg-slate-900 border border-deck-border text-slate-300 px-2 py-0.5 rounded-full text-[10px] font-mono">12 Crates Configured</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleSelectAll(true)" class="text-deck-green font-medium">Select All</button>
        <span class="text-slate-700">|</span>
        <button onclick="toggleSelectAll(false)" class="text-slate-400">Deselect</button>
        <button onclick="createAllSelectedPlaylists()" class="touch-press ml-2 px-3 py-1 bg-deck-green text-black font-bold rounded-lg text-[11px] shadow">Export Selected</button>
      </div>
    </div>

    <!-- The 12 DJ Crate Cards Grid -->
    <div id="crateGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- Crate cards dynamically injected here -->
    </div>
  </main>

  <!-- Slide-up Track Crate Drawer (Mobile Native Sheet) -->
  <div id="crateDrawerBackdrop" onclick="closeCrateDrawer()" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
  <div id="crateDrawer" class="fixed inset-x-0 bottom-0 z-50 bg-[#12141c] rounded-t-3xl border-t border-deck-border max-h-[85vh] flex flex-col translate-y-full transition-transform duration-300 pb-[calc(var(--sab)+12px)] max-w-3xl mx-auto">
    <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto my-3 flex-shrink-0 cursor-pointer" onclick="closeCrateDrawer()"></div>
    
    <div class="px-5 pb-3 border-b border-deck-border flex items-center justify-between flex-shrink-0">
      <div>
        <h3 id="drawerCrateTitle" class="text-base font-bold text-white leading-tight">Crate Name</h3>
        <p id="drawerCrateSub" class="text-xs text-slate-400 mt-0.5">0 tracks</p>
      </div>
      <button onclick="exportActiveDrawerCrate()" class="touch-press px-3 py-1.5 rounded-xl bg-deck-green text-black font-semibold text-xs flex items-center gap-1.5 shadow">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Create Spotify Playlist
      </button>
    </div>

    <div id="drawerTrackList" class="flex-1 overflow-y-auto px-4 py-3 space-y-2 custom-scrollbar"></div>
  </div>

  <!-- Connect Modal -->
  <div id="authModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-deck-card w-full max-w-md rounded-2xl border border-deck-border p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white">Spotify Connection</h3>
        <button onclick="toggleAuthModal()" class="text-slate-400 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="text-xs text-slate-400 leading-relaxed">
        Requires a Spotify Developer Client ID with your live URL configured as a Redirect URI.
      </p>
      <div>
        <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Spotify Client ID</label>
        <input type="text" id="clientIdInput" placeholder="Paste 32-character Client ID..." class="w-full bg-slate-900 border border-deck-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-deck-green">
      </div>
      <div class="pt-2 flex gap-2">
        <button onclick="saveAndAuthorize()" class="touch-press flex-1 py-2 bg-deck-green text-black font-bold text-xs rounded-xl shadow transition">
          Authorize with Spotify
        </button>
        <button onclick="clearStoredAuth()" class="touch-press px-3 py-2 bg-slate-800 text-slate-300 font-semibold text-xs rounded-xl hover:bg-slate-700">
          Reset
        </button>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto" class="hidden"></audio>

  <script>
    const CLIENT_ID_KEY = 'tracksort_client_id';
    const CACHED_CRATES_KEY = 'tracksort_saved_crates_v2';
    const CODE_VERIFIER_KEY = 'tracksort_code_verifier';

    // The 12 Crate Definitions exactly matching the layout & taxonomy in your screenshot
    const DJ_CRATES = [
      {
        id: 'hiphop_rap',
        name: 'Hip-Hop / Rap',
        color: '#f59e0b', // Amber/Yellow
        regex: /(rap|hip.?hop|trap|drill|boom.?bap|phonk|gangsta|freestyle)/i,
        exclusions: ['house', 'techno']
      },
      {
        id: 'tech_rolling',
        name: 'Tech & Rolling House',
        color: '#10b981', // Emerald
        regex: /(tech house|rolling house|bass house|deep tech|groove room)/i,
        exclusions: ['hip hop', 'trap', 'drill']
      },
      {
        id: 'funky_groovy',
        name: 'Funky & Groovy House',
        color: '#f97316', // Orange
        regex: /(funky house|disco house|jackin|french touch|nu disco|vocal house)/i,
        exclusions: ['techno', 'trap']
      },
      {
        id: 'deep_melodic',
        name: 'Deep & Melodic House',
        color: '#3b82f6', // Blue
        regex: /(deep house|melodic house|progressive house|organic house|afro house|sunset)/i,
        exclusions: ['trap', 'drill']
      },
      {
        id: 'minimal_micro',
        name: 'Minimal & Microhouse',
        color: '#a855f7', // Purple
        regex: /(minimal house|microhouse|rominimal|minimal techno|micro house)/i,
        exclusions: ['hip hop', 'drill']
      },
      {
        id: 'afro_latin',
        name: 'Afro & Latin House',
        color: '#ec4899', // Pink
        regex: /(afro house|latin house|tribal house|amapiano|baile|cumbia electro)/i,
        exclusions: []
      },
      {
        id: 'general_house',
        name: 'General House & Club',
        color: '#14b8a6', // Teal
        regex: /(house|club|electro house|dance)/i,
        exclusions: ['hip hop', 'rap', 'rock']
      },
      {
        id: 'techno_hardgroove',
        name: 'Techno & Hardgroove',
        color: '#ef4444', // Red
        regex: /(techno|hardgroove|peak time|industrial techno|acid techno|hard dance)/i,
        exclusions: []
      },
      {
        id: 'ukg_dnb',
        name: 'UK Garage & DnB',
        color: '#06b6d4', // Cyan
        regex: /(uk garage|garage|2-step|drum and bass|dnb|jungle|breakbeat)/i,
        exclusions: []
      },
      {
        id: 'jazz_soul_acoustic',
        name: 'Jazz, Soul & Acoustic',
        color: '#6366f1', // Indigo
        regex: /(jazz|soul|neo-soul|classical|piano|acoustic|lo-fi|blues)/i,
        exclusions: ['techno', 'drill']
      },
      {
        id: 'rock_alternative',
        name: 'Rock & Alternative',
        color: '#f97316', // Light Orange
        regex: /(rock|alternative|indie rock|punk|grunge|metal)/i,
        exclusions: ['hip hop', 'house']
      },
      {
        id: 'pop_dance',
        name: 'Pop & Dance',
        color: '#8b5cf6', // Violet
        regex: /(pop|dance pop|synth-pop|indie pop)/i,
        exclusions: ['drill', 'techno']
      }
    ];

    let accessToken = null;
    let crateStore = {};
    let activeDrawerCrateId = null;
    const audio = document.getElementById('audioPlayer');

    window.addEventListener('DOMContentLoaded', async () => {
      const savedClientId = localStorage.getItem(CLIENT_ID_KEY) || '4c40070fe3c94db8e13c4bc587d6e7';
      document.getElementById('clientIdInput').value = savedClientId;

      // Handle OAuth Redirect
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        history.replaceState(null, '', window.location.pathname);
        await exchangeCodeForToken(code);
      }

      // Initialize empty or cached crates
      const cached = localStorage.getItem(CACHED_CRATES_KEY);
      if (cached) {
        try {
          crateStore = JSON.parse(cached);
          renderCrates();
          document.getElementById('librarySummaryBadge').textContent = 'Library Restored from Cache';
        } catch (e) {
          initEmptyStore();
        }
      } else {
        initEmptyStore();
      }
    });

    function initEmptyStore() {
      crateStore = {};
      DJ_CRATES.forEach(c => {
        crateStore[c.id] = { ...c, tracks: [], selected: true };
      });
      renderCrates();
    }

    function toggleAuthModal() {
      document.getElementById('authModal').classList.toggle('hidden');
    }

    function getRedirectUri() {
      return window.location.origin + window.location.pathname;
    }

    async function saveAndAuthorize() {
      const clientId = document.getElementById('clientIdInput').value.trim() || '4c40070fe3c94db8e13c4bc587d6e7';
      localStorage.setItem(CLIENT_ID_KEY, clientId);

      const verifier = generateRandomString(64);
      localStorage.setItem(CODE_VERIFIER_KEY, verifier);
      const challenge = await generateCodeChallenge(verifier);

      const scope = 'user-library-read playlist-modify-public playlist-modify-private';
      const redirectUri = getRedirectUri();

      window.location.href = `https://accounts.spotify.com/authorize?response_type=code&client_id=${encodeURIComponent(clientId)}&scope=${encodeURIComponent(scope)}&redirect_uri=${encodeURIComponent(redirectUri)}&code_challenge_method=S256&code_challenge=${encodeURIComponent(challenge)}`;
    }

    async function exchangeCodeForToken(code) {
      const clientId = localStorage.getItem(CLIENT_ID_KEY) || '4c40070fe3c94db8e13c4bc587d6e7';
      const verifier = localStorage.getItem(CODE_VERIFIER_KEY);
      const redirectUri = getRedirectUri();

      try {
        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: clientId,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: redirectUri,
            code_verifier: verifier
          })
        });
        const data = await res.json();
        if (data.access_token) {
          accessToken = data.access_token;
          document.getElementById('authDot').className = "w-2 h-2 rounded-full bg-deck-green";
          document.getElementById('authText').textContent = "Connected";
        }
      } catch (err) {
        console.error("Token error", err);
      }
    }

    function clearStoredAuth() {
      localStorage.clear();
      location.reload();
    }

    // Spotify Scan Pipeline
    async function startLibraryScan() {
      if (!accessToken) {
        toggleAuthModal();
        return;
      }

      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressPct = document.getElementById('progressPct');
      const progressStatus = document.getElementById('progressStatus');
      
      progressContainer.classList.remove('hidden');
      progressStatus.textContent = "Fetching all liked tracks...";

      try {
        let items = [];
        let url = 'https://api.spotify.com/v1/me/tracks?limit=50';
        let total = 0;

        while (url) {
          const res = await fetch(url, { headers: { 'Authorization': `Bearer ${accessToken}` } });
          if (!res.ok) throw new Error("Spotify track fetch failed");
          const data = await res.json();
          total = data.total;
          items = items.concat(data.items);
          
          const pct = Math.min(Math.round((items.length / total) * 50), 50);
          progressBar.style.width = `${pct}%`;
          progressPct.textContent = `${pct}%`;
          url = data.next;
        }

        progressStatus.textContent = "Resolving subgenres from artist profiles...";
        const artistIds = [...new Set(items.flatMap(i => i.track?.artists?.map(a => a.id) || []))].filter(Boolean);
        const artistGenreMap = {};

        for (let i = 0; i < artistIds.length; i += 50) {
          const batch = artistIds.slice(i, i + 50);
          const aRes = await fetch(`https://api.spotify.com/v1/artists?ids=${batch.join(',')}`, {
            headers: { 'Authorization': `Bearer ${accessToken}` }
          });
          if (aRes.ok) {
            const aData = await aRes.json();
            aData.artists.forEach(a => {
              if (a) artistGenreMap[a.id] = a.genres || [];
            });
          }
          const pct = 50 + Math.min(Math.round((i / artistIds.length) * 48), 48);
          progressBar.style.width = `${pct}%`;
          progressPct.textContent = `${pct}%`;
        }

        initEmptyStore();

        items.forEach(({ track }) => {
          if (!track || !track.id) return;
          const genres = track.artists?.flatMap(a => artistGenreMap[a.id] || []) || [];
          const genreStr = genres.join(' ').toLowerCase();

          for (const def of DJ_CRATES) {
            const hasExclusion = def.exclusions?.some(ex => genreStr.includes(ex));
            if (!hasExclusion && def.regex.test(genreStr)) {
              crateStore[def.id].tracks.push({
                id: track.id,
                uri: `spotify:track:${track.id}`,
                name: track.name,
                artist: track.artists.map(a => a.name).join(', '),
                preview_url: track.preview_url,
                image: track.album?.images?.[1]?.url || track.album?.images?.[0]?.url || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&q=80'
              });
              break;
            }
          }
        });

        localStorage.setItem(CACHED_CRATES_KEY, JSON.stringify(crateStore));

        progressBar.style.width = `100%`;
        progressPct.textContent = `100%`;
        setTimeout(() => progressContainer.classList.add('hidden'), 500);

        document.getElementById('librarySummaryBadge').textContent = `${items.length} Liked Tracks Sorted`;
        renderCrates();

      } catch (err) {
        console.error(err);
        alert("Scan encountered an issue. Please try again.");
        progressContainer.classList.add('hidden');
      }
    }

    // Render the exact aesthetic cards from your screenshot
    function renderCrates() {
      const grid = document.getElementById('crateGrid');
      grid.innerHTML = '';

      DJ_CRATES.forEach(c => {
        const crate = crateStore[c.id] || { ...c, tracks: [], selected: true };
        const count = crate.tracks.length;
        const track1 = crate.tracks[0];
        const track2 = crate.tracks[1];

        // Unique artist summary
        const artistsSummary = crate.tracks.length 
          ? [...new Set(crate.tracks.flatMap(t => t.artist.split(', ')))].slice(0, 4).join(', ')
          : 'No tracks assigned';

        const card = document.createElement('div');
        card.className = "bg-deck-card border border-deck-border rounded-2xl p-4 flex flex-col justify-between space-y-4 hover:border-deck-borderHover transition-all";
        card.innerHTML = `
          <!-- Card Header -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <input type="checkbox" ${crate.selected ? 'checked' : ''} onchange="toggleSelect('${c.id}', this.checked)" class="w-4 h-4 rounded accent-blue-500 bg-slate-900 border-deck-border cursor-pointer">
                <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${c.color}"></span>
              </div>
              <span class="text-[10px] font-mono tracking-wider ${count ? 'text-slate-300 bg-slate-800/80' : 'text-slate-600 bg-slate-900'} px-2 py-0.5 rounded-md border border-slate-800">
                ${count} Tracks
              </span>
            </div>

            <h3 class="text-sm font-bold text-white tracking-tight leading-tight">${c.name}</h3>
            <p class="text-[10px] text-slate-400 truncate mt-1">${artistsSummary}</p>
          </div>

          <!-- Track Rows or Empty state -->
          <div class="space-y-1.5 min-h-[50px] flex flex-col justify-center">
            ${count ? `
              <div class="flex items-center justify-between text-[11px] text-slate-300">
                <span class="truncate max-w-[130px] font-medium">\${track1.name}</span>
                <span class="text-[10px] text-slate-500 font-mono">126 BPM · 8A</span>
              </div>
              \${track2 ? `
              <div class="flex items-center justify-between text-[11px] text-slate-300">
                <span class="truncate max-w-[130px] font-medium">${track2.name}</span>
                <span class="text-[10px] text-slate-500 font-mono">124 BPM · 2A</span>
              </div>` : ''}
            ` : `
              <p class="text-[11px] text-slate-600 italic">Crate empty</p>
            `}
          </div>

          <!-- Bottom Actions -->
          <div class="flex items-center gap-2 pt-2 border-t border-deck-border/60">
            <button onclick="openCrateDrawer('${c.id}')" class="touch-press flex-1 py-1.5 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-deck-border text-xs font-semibold text-slate-200 flex items-center justify-center gap-2 transition">
              <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
              View Crate
            </button>
            <button onclick="exportSingleCrate('${c.id}')" title="Export to Spotify" class="touch-press p-1.5 px-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-deck-border text-slate-300 text-xs font-bold transition">
              +
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleSelect(id, val) {
      if (crateStore[id]) crateStore[id].selected = val;
    }

    function toggleSelectAll(val) {
      DJ_CRATES.forEach(c => {
        if (crateStore[c.id]) crateStore[c.id].selected = val;
      });
      renderCrates();
    }

    // Drawer System
    function openCrateDrawer(id) {
      activeDrawerCrateId = id;
      const crate = crateStore[id];
      if (!crate) return;

      document.getElementById('drawerCrateTitle').textContent = crate.name;
      document.getElementById('drawerCrateSub').textContent = `${crate.tracks.length} tracks`;

      const list = document.getElementById('drawerTrackList');
      list.innerHTML = '';

      if (!crate.tracks.length) {
        list.innerHTML = '<p class="text-xs text-slate-500 text-center py-10 italic">No tracks categorized in this crate.</p>';
      } else {
        crate.tracks.forEach(track => {
          const row = document.createElement('div');
          row.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border border-deck-border hover:border-slate-600 cursor-pointer touch-press";
          row.onclick = () => playPreview(track);
          row.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden flex-1">
              <img src="${track.image}" class="w-9 h-9 rounded-lg object-cover bg-slate-800 flex-shrink-0" alt="art">
              <div class="truncate">
                <p class="text-xs font-bold text-white truncate leading-tight">${track.name}</p>
                <p class="text-[10px] text-slate-400 truncate mt-0.5">${track.artist}</p>
              </div>
            </div>
            <button class="p-1 text-deck-green">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          `;
          list.appendChild(row);
        });
      }

      document.getElementById('crateDrawerBackdrop').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('crateDrawer').classList.remove('translate-y-full');
    }

    function closeCrateDrawer() {
      document.getElementById('crateDrawerBackdrop').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('crateDrawer').classList.add('translate-y-full');
      audio.pause();
    }

    function playPreview(track) {
      if (track.preview_url) {
        audio.src = track.preview_url;
        audio.play().catch(console.error);
      } else {
        playBeep();
      }
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch (e) {}
    }

    // Export Playlists
    function exportActiveDrawerCrate() {
      if (activeDrawerCrateId) exportSingleCrate(activeDrawerCrateId);
    }

    async function createAllSelectedPlaylists() {
      const selected = DJ_CRATES.filter(c => crateStore[c.id]?.selected && crateStore[c.id]?.tracks.length);
      if (!selected.length) {
        alert("Please select at least one crate that contains tracks.");
        return;
      }
      for (const c of selected) {
        await exportSingleCrate(c.id);
      }
      alert("Selected crates exported to your Spotify account!");
    }

    async function exportSingleCrate(crateId) {
      if (!accessToken) {
        toggleAuthModal();
        return;
      }
      const crate = crateStore[crateId];
      if (!crate || !crate.tracks.length) return;

      try {
        const userRes = await fetch('https://api.spotify.com/v1/me', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const user = await userRes.json();

        const plRes = await fetch(`https://api.spotify.com/v1/users/${user.id}/playlists`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: `Liked - ${crate.name}`,
            description: `Generated by TrackSort DJ Crate Deck.`,
            public: false
          })
        });
        const pl = await plRes.json();

        const uris = crate.tracks.map(t => t.uri).filter(u => u.startsWith('spotify:track:'));
        for (let i = 0; i < uris.length; i += 50) {
          const chunk = uris.slice(i, i + 50);
          await fetch(`https://api.spotify.com/v1/playlists/${pl.id}/tracks`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${accessToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ uris: chunk })
          });
        }
      } catch (e) {
        console.error("Export error", e);
      }
    }

    // Auth Utilities
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let text = '';
      for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
      return text;
    }

    async function generateCodeChallenge(verifier) {
      const encoder = new TextEncoder();
      const data = encoder.encode(verifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
    }
  </script>
