<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TRACKSORT - Subgenre Sorter</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrackSort">
  <meta name="theme-color" content="#0c0d12">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deck: {
              bg: '#0c0d12',
              card: '#13151c',
              border: '#1f2330',
              borderHover: '#2d3345',
              subtle: '#8a91a5',
              green: '#1ed760'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      background-color: #0c0d12;
      padding-top: var(--sat);
      padding-bottom: calc(var(--sab) + 30px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .touch-press:active {
      transform: scale(0.97);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #232733;
      border-radius: 9999px;
    }
    /* Smooth sliding transitions */
    #crateDrawer {
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
    }
    #crateDrawerBackdrop {
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col font-sans antialiased select-none">

  <!-- DJ Deck Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-deck-bg/95 backdrop-blur border-b border-deck-border px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-deck-green/20 border border-deck-green/30 flex items-center justify-center text-deck-green shadow-lg">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-black tracking-wider text-white uppercase leading-none">TRACKSORT</h1>
          <span class="text-[9px] font-mono tracking-widest uppercase bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700">SUBGENRE SORTER</span>
        </div>
        <p class="text-[11px] text-slate-400 mt-0.5">Sort Liked Songs by Subgenres</p>
      </div>
    </div>

    <div class="flex items-center flex-wrap gap-2.5">
      <div class="flex bg-slate-900 border border-deck-border rounded-xl p-0.5 text-xs font-semibold">
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-deck-green text-black shadow">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.65 14.65c-.2.3-.6.4-.9.2-2.4-1.5-5.5-1.8-9.1-1-.4.1-.7-.2-.8-.5-.1-.4.2-.7.5-.8 4-.9 7.4-.5 10.1 1.2.3.2.4.6.2.9zm1.3-2.9c-.3.4-.8.5-1.2.3-3-1.8-7.5-2.4-11-1.3-.5.1-1-.2-1.1-.6-.1-.5.2-1 .6-1.1 4.1-1.2 9.1-.6 12.4 1.5.5.3.6.8.3 1.2zm.1-3C14.5 8.9 8.2 8.7 4.8 9.7c-.6.2-1.2-.2-1.4-.7-.2-.6.2-1.2.7-1.4 4-1.2 10.9-1 15 1.5.5.3.7 1 .4 1.5-.2.5-.9.7-1.5.4z"/></svg>
          Spotify
        </button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-400 opacity-60 cursor-not-allowed">
          SoundCloud
        </button>
      </div>

      <button id="scanBtn" onclick="startLibraryScan()" class="touch-press px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-deck-border text-xs font-semibold text-white flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5 text-deck-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span id="scanBtnText">Scan Library</span>
      </button>

      <button id="authBtn" onclick="toggleAuthModal()" class="touch-press px-3.5 py-1.5 rounded-xl bg-slate-900 border border-deck-border text-xs font-semibold text-white hover:border-slate-600 flex items-center gap-2 cursor-pointer">
        <span id="authDot" class="w-2 h-2 rounded-full bg-red-500"></span>
        <span id="authText">Connect Spotify</span>
      </button>
    </div>
  </header>

  <!-- Progress Bar Overlay -->
  <div id="progressContainer" class="hidden bg-slate-900 border-b border-deck-border px-4 py-2">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-slate-400 mb-1">
      <span id="progressStatus">Reading liked tracks...</span>
      <span id="progressPct" class="font-mono text-deck-green font-bold">0%</span>
    </div>
    <div class="max-w-7xl mx-auto w-full bg-slate-800 rounded-full h-1 overflow-hidden">
      <div id="progressBar" class="bg-deck-green h-full rounded-full transition-all duration-200" style="width: 0%"></div>
    </div>
  </div>

  <!-- Main Crate Grid -->
  <main class="flex-1 px-4 lg:px-8 py-6 max-w-7xl mx-auto w-full space-y-4">
    <div class="flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="text-slate-400 font-semibold uppercase tracking-wider text-[11px]">DJ Crate Deck</span>
        <span id="librarySummaryBadge" class="bg-slate-900 border border-deck-border text-slate-300 px-2 py-0.5 rounded-full text-[10px] font-mono">12 Crates Configured</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleSelectAll(true)" class="text-deck-green font-medium cursor-pointer">Select All</button>
        <span class="text-slate-700">|</span>
        <button onclick="toggleSelectAll(false)" class="text-slate-400 cursor-pointer">Deselect</button>
        <button onclick="createAllSelectedPlaylists()" class="touch-press ml-2 px-3 py-1 bg-deck-green text-black font-bold rounded-lg text-[11px] shadow cursor-pointer">Export Selected</button>
      </div>
    </div>

    <div id="crateGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  </main>

  <!-- Smooth Slide-Out Track Crate Drawer -->
  <div id="crateDrawerBackdrop" onclick="closeCrateDrawer()" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
  <div id="crateDrawer" class="fixed inset-x-0 bottom-0 z-50 bg-[#12141c] rounded-t-3xl border-t border-deck-border max-h-[85vh] flex flex-col translate-y-full transition-transform duration-300 pb-[calc(var(--sab)+12px)] max-w-3xl mx-auto shadow-2xl">
    
    <!-- Swipe Handle Area -->
    <div id="drawerSwipeArea" class="w-full py-3 flex flex-col items-center justify-center cursor-pointer select-none">
      <div class="w-14 h-1.5 bg-slate-700 hover:bg-slate-500 rounded-full transition"></div>
      <p class="text-[9px] text-slate-500 uppercase tracking-widest mt-1">Swipe down or tap to close</p>
    </div>
    
    <div class="px-5 pb-3 border-b border-deck-border flex items-center justify-between flex-shrink-0">
      <div>
        <h3 id="drawerCrateTitle" class="text-base font-bold text-white leading-tight">Crate Name</h3>
        <p id="drawerCrateSub" class="text-xs text-slate-400 mt-0.5">0 tracks</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportActiveDrawerCrate()" id="drawerExportBtn" class="touch-press px-3.5 py-1.5 rounded-xl bg-deck-green text-black font-semibold text-xs flex items-center gap-1.5 shadow cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span id="drawerExportBtnText">Create Playlist</span>
        </button>
        <button onclick="closeCrateDrawer()" class="p-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div id="drawerTrackList" class="flex-1 overflow-y-auto px-4 py-3 space-y-2 custom-scrollbar"></div>
  </div>

  <!-- Connect Modal -->
  <div id="authModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-deck-card w-full max-w-md rounded-2xl border border-deck-border p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white">Spotify Connection</h3>
        <button onclick="toggleAuthModal()" class="text-slate-400 hover:text-white p-1 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="text-xs text-slate-400 leading-relaxed">
        Authorize access with Spotify OAuth PKCE to scan liked songs and create playlists.
      </p>
      <div>
        <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Spotify Client ID</label>
        <input type="text" id="clientIdInput" value="4c40070fe3c94db8e13c4bc587d6e7" placeholder="Paste 32-character Client ID..." class="w-full bg-slate-900 border border-deck-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-deck-green">
      </div>
      <div class="pt-2 flex gap-2">
        <button onclick="saveAndAuthorize()" class="touch-press flex-1 py-2 bg-deck-green text-black font-bold text-xs rounded-xl shadow transition cursor-pointer">
          Authorize with Spotify
        </button>
        <button onclick="clearStoredAuth()" class="touch-press px-3 py-2 bg-slate-800 text-slate-300 font-semibold text-xs rounded-xl hover:bg-slate-700 cursor-pointer">
          Reset
        </button>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto" class="hidden"></audio>

  <script>
    var CLIENT_ID_KEY = 'tracksort_client_id';
    var CACHED_CRATES_KEY = 'tracksort_saved_crates_v6';
    var CODE_VERIFIER_KEY = 'tracksort_code_verifier';

    var DJ_CRATES = [
      { id: 'tech_rolling', name: 'Tech & Rolling House', color: '#10b981', regex: /(tech house|rolling house|bass house|deep tech|groove room|minimal tech|club house|stussy|anotr|pawsa|chris stussy)/i, exclusions: ['hip hop', 'trap', 'drill'] },
      { id: 'deep_melodic', name: 'Deep & Melodic House', color: '#3b82f6', regex: /(deep house|melodic house|progressive house|organic house|afro house|sunset|chill house|tropical house)/i, exclusions: ['trap', 'drill'] },
      { id: 'funky_groovy', name: 'Funky & Groovy House', color: '#f97316', regex: /(funky house|disco house|jackin|french touch|nu disco|vocal house|midland|shouse|franky rizardo)/i, exclusions: ['techno', 'trap'] },
      { id: 'minimal_micro', name: 'Minimal & Microhouse', color: '#a855f7', regex: /(minimal|microhouse|rominimal|micro house|minimal techno)/i, exclusions: ['hip hop', 'drill'] },
      { id: 'hiphop_rap', name: 'Hip-Hop / Rap', color: '#f59e0b', regex: /(rap|hip.?hop|trap|drill|boom.?bap|phonk|gangsta|freestyle|grime|french rap|rap francais)/i, exclusions: ['house', 'techno'] },
      { id: 'techno_hardgroove', name: 'Techno & Hardgroove', color: '#ef4444', regex: /(techno|hardgroove|peak time|industrial techno|acid techno|hard dance|rave)/i, exclusions: [] },
      { id: 'afro_latin', name: 'Afro & Latin House', color: '#ec4899', regex: /(afro house|latin house|tribal house|amapiano|baile|cumbia electro|reggaeton)/i, exclusions: [] },
      { id: 'ukg_dnb', name: 'UK Garage & DnB', color: '#06b6d4', regex: /(uk garage|garage|2-step|drum and bass|dnb|jungle|breakbeat|bassline)/i, exclusions: [] },
      { id: 'jazz_soul_acoustic', name: 'Jazz, Soul & Acoustic', color: '#6366f1', regex: /(jazz|soul|neo-soul|classical|piano|acoustic|lo-fi|blues|ambient|downtempo)/i, exclusions: ['techno', 'drill'] },
      { id: 'rock_alternative', name: 'Rock & Alternative', color: '#f97316', regex: /(rock|alternative|indie rock|punk|grunge|metal|garage rock)/i, exclusions: ['hip hop', 'house'] },
      { id: 'pop_dance', name: 'Pop & Dance', color: '#8b5cf6', regex: /(pop|dance pop|synth-pop|indie pop|electropop|europop)/i, exclusions: ['drill', 'techno'] },
      { id: 'general_house', name: 'General House & Club', color: '#14b8a6', regex: /.*/, exclusions: [] }
    ];

    var accessToken = null;
    var crateStore = {};
    var activeDrawerCrateId = null;
    var activeAudioNode = null;
    var currentPlayingId = null;

    function toggleAuthModal() {
      var modal = document.getElementById('authModal');
      if (modal) modal.classList.toggle('hidden');
    }

    function initEmptyStore() {
      crateStore = {};
      for (var i = 0; i < DJ_CRATES.length; i++) {
        var c = DJ_CRATES[i];
        crateStore[c.id] = { id: c.id, name: c.name, color: c.color, regex: c.regex, exclusions: c.exclusions, tracks: [], selected: true };
      }
      renderCrates();
    }

    function renderCrates() {
      var grid = document.getElementById('crateGrid');
      if (!grid) return;
      grid.innerHTML = '';

      for (var i = 0; i < DJ_CRATES.length; i++) {
        var c = DJ_CRATES[i];
        var crate = crateStore[c.id] || { tracks: [], selected: true };
        var tracks = Array.isArray(crate.tracks) ? crate.tracks : [];
        var count = tracks.length;

        var artistsSummary = 'No tracks assigned';
        if (count > 0) {
          var artistList = [];
          for (var t = 0; t < tracks.length; t++) {
            if (tracks[t] && tracks[t].artist) {
              var parts = tracks[t].artist.split(', ');
              for (var p = 0; p < parts.length; p++) {
                if (parts[p] && artistList.indexOf(parts[p]) === -1) {
                  artistList.push(parts[p]);
                }
              }
            }
          }
          artistsSummary = artistList.slice(0, 4).join(', ');
        }

        var trackRowsHtml = '<p class="text-[11px] text-slate-600 italic">Crate empty</p>';
        if (count > 0 && tracks[0]) {
          var t1 = tracks[0];
          trackRowsHtml = '<div class="flex items-center justify-between text-[11px] text-slate-300">' +
            '<span class="truncate max-w-[130px] font-medium">' + (t1.name || '') + '</span>' +
            '<span class="text-[10px] text-slate-500 font-mono">126 BPM · 8A</span>' +
            '</div>';
          if (tracks[1]) {
            var t2 = tracks[1];
            trackRowsHtml += '<div class="flex items-center justify-between text-[11px] text-slate-300">' +
              '<span class="truncate max-w-[130px] font-medium">' + (t2.name || '') + '</span>' +
              '<span class="text-[10px] text-slate-500 font-mono">124 BPM · 2A</span>' +
              '</div>';
          }
        }

        var badgeClass = count ? 'text-slate-300 bg-slate-800/80' : 'text-slate-600 bg-slate-900';
        var isChecked = crate.selected ? 'checked' : '';

        var card = document.createElement('div');
        card.className = "bg-deck-card border border-deck-border rounded-2xl p-4 flex flex-col justify-between space-y-4 hover:border-deck-borderHover transition-all";
        card.innerHTML = 
          '<div>' +
            '<div class="flex items-center justify-between mb-2">' +
              '<div class="flex items-center gap-2">' +
                '<input type="checkbox" ' + isChecked + ' onchange="toggleSelect(\'' + c.id + '\', this.checked)" class="w-4 h-4 rounded accent-blue-500 bg-slate-900 border-deck-border cursor-pointer">' +
                '<span class="w-2.5 h-2.5 rounded-full" style="background-color: ' + c.color + '"></span>' +
              '</div>' +
              '<span class="text-[10px] font-mono tracking-wider ' + badgeClass + ' px-2 py-0.5 rounded-md border border-slate-800">' + count + ' Tracks</span>' +
            '</div>' +
            '<h3 class="text-sm font-bold text-white tracking-tight leading-tight">' + c.name + '</h3>' +
            '<p class="text-[10px] text-slate-400 truncate mt-1">' + artistsSummary + '</p>' +
          '</div>' +
          '<div class="space-y-1.5 min-h-[50px] flex flex-col justify-center">' +
            trackRowsHtml +
          '</div>' +
          '<div class="flex items-center gap-2 pt-2 border-t border-deck-border/60">' +
            '<button onclick="openCrateDrawer(\'' + c.id + '\')" class="touch-press flex-1 py-1.5 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-deck-border text-xs font-semibold text-slate-200 flex items-center justify-center gap-2 transition cursor-pointer">' +
              '<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>' +
              'View Crate' +
            '</button>' +
            '<button onclick="exportSingleCrate(\'' + c.id + '\')" title="Export to Spotify" class="touch-press p-1.5 px-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-deck-border text-slate-300 text-xs font-bold transition cursor-pointer">+</button>' +
          '</div>';
        
        grid.appendChild(card);
      }
    }

    function toggleSelect(id, val) {
      if (crateStore[id]) crateStore[id].selected = val;
    }

    function toggleSelectAll(val) {
      for (var i = 0; i < DJ_CRATES.length; i++) {
        var id = DJ_CRATES[i].id;
        if (crateStore[id]) crateStore[id].selected = val;
      }
      renderCrates();
    }

    function getRedirectUri() {
      return window.location.origin + window.location.pathname;
    }

    async function saveAndAuthorize() {
      var input = document.getElementById('clientIdInput');
      var clientId = (input && input.value.trim()) || '4c40070fe3c94db8e13c4bc587d6e7';
      localStorage.setItem(CLIENT_ID_KEY, clientId);

      var verifier = generateRandomString(64);
      localStorage.setItem(CODE_VERIFIER_KEY, verifier);
      var challenge = await generateCodeChallenge(verifier);

      // Scopes explicitly needed for public/private playlist generation
      var scope = 'user-library-read playlist-modify-public playlist-modify-private playlist-read-private';
      var redirectUri = getRedirectUri();

      window.location.href = 'https://accounts.spotify.com/authorize?response_type=code&client_id=' + encodeURIComponent(clientId) + '&scope=' + encodeURIComponent(scope) + '&redirect_uri=' + encodeURIComponent(redirectUri) + '&code_challenge_method=S256&code_challenge=' + encodeURIComponent(challenge);
    }

    async function exchangeCodeForToken(code) {
      var clientId = localStorage.getItem(CLIENT_ID_KEY) || '4c40070fe3c94db8e13c4bc587d6e7';
      var verifier = localStorage.getItem(CODE_VERIFIER_KEY);
      var redirectUri = getRedirectUri();

      try {
        var res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: clientId,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: redirectUri,
            code_verifier: verifier
          })
        });
        var data = await res.json();
        if (data.access_token) {
          accessToken = data.access_token;
          var dot = document.getElementById('authDot');
          var txt = document.getElementById('authText');
          if (dot) dot.className = "w-2 h-2 rounded-full bg-deck-green";
          if (txt) txt.textContent = "Connected";
        }
      } catch (err) {
        console.error("Token error", err);
      }
    }

    function clearStoredAuth() {
      localStorage.clear();
      location.reload();
    }

    function sleep(ms) {
      return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }

    async function startLibraryScan() {
      if (!accessToken) {
        toggleAuthModal();
        return;
      }

      var progressContainer = document.getElementById('progressContainer');
      var progressBar = document.getElementById('progressBar');
      var progressPct = document.getElementById('progressPct');
      var progressStatus = document.getElementById('progressStatus');
      
      progressContainer.classList.remove('hidden');
      progressStatus.textContent = "Fetching all liked tracks...";

      try {
        var items = [];
        var url = 'https://api.spotify.com/v1/me/tracks?limit=50';
        var total = 0;

        while (url) {
          var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + accessToken } });
          if (!res.ok) throw new Error("Spotify track fetch failed");
          var data = await res.json();
          total = data.total || total;
          items = items.concat(data.items || []);
          
          var pct = Math.min(Math.round((items.length / total) * 50), 50);
          progressBar.style.width = pct + '%';
          progressPct.textContent = pct + '%';
          url = data.next;
        }

        progressStatus.textContent = "Analyzing artist metadata & subgenres...";
        var artistIds = [];
        for (var i = 0; i < items.length; i++) {
          var track = items[i].track;
          if (track && track.artists) {
            for (var a = 0; a < track.artists.length; a++) {
              var aId = track.artists[a].id;
              if (aId && artistIds.indexOf(aId) === -1) artistIds.push(aId);
            }
          }
        }

        var artistGenreMap = {};
        for (var b = 0; b < artistIds.length; b += 50) {
          var batch = artistIds.slice(b, b + 50);
          try {
            var aRes = await fetch('https://api.spotify.com/v1/artists?ids=' + batch.join(','), {
              headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (aRes.ok) {
              var aData = await aRes.json();
              if (aData.artists) {
                for (var k = 0; k < aData.artists.length; k++) {
                  var art = aData.artists[k];
                  if (art) artistGenreMap[art.id] = art.genres || [];
                }
              }
            }
          } catch (e) {
            console.warn("Batch failed", e);
          }
          var pctBatch = 50 + Math.min(Math.round((b / artistIds.length) * 48), 48);
          progressBar.style.width = pctBatch + '%';
          progressPct.textContent = pctBatch + '%';
          await sleep(50);
        }

        initEmptyStore();

        for (var j = 0; j < items.length; j++) {
          var t = items[j].track;
          if (!t || !t.id) continue;

          var genreTokens = [];
          var artNames = [];
          if (t.artists) {
            for (var artIdx = 0; artIdx < t.artists.length; artIdx++) {
              var artObj = t.artists[artIdx];
              artNames.push(artObj.name);
              var gList = artistGenreMap[artObj.id] || [];
              genreTokens = genreTokens.concat(gList);
              genreTokens.push(artObj.name.toLowerCase());
            }
          }
          if (t.name) genreTokens.push(t.name.toLowerCase());

          var combinedSearchStr = genreTokens.join(' ').toLowerCase();
          var matched = false;

          for (var cIdx = 0; cIdx < DJ_CRATES.length; cIdx++) {
            var def = DJ_CRATES[cIdx];
            var excluded = false;
            if (def.exclusions) {
              for (var ex = 0; ex < def.exclusions.length; ex++) {
                if (combinedSearchStr.indexOf(def.exclusions[ex]) !== -1) {
                  excluded = true;
                  break;
                }
              }
            }
            if (!excluded && def.regex.test(combinedSearchStr)) {
              crateStore[def.id].tracks.push({
                id: t.id,
                uri: 'spotify:track:' + t.id,
                name: t.name,
                artist: artNames.join(', '),
                preview_url: t.preview_url,
                image: (t.album && t.album.images && t.album.images[0] && t.album.images[0].url) || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&q=80'
              });
              matched = true;
              break;
            }
          }

          if (!matched) {
            crateStore['general_house'].tracks.push({
              id: t.id,
              uri: 'spotify:track:' + t.id,
              name: t.name,
              artist: artNames.join(', '),
              preview_url: t.preview_url,
              image: (t.album && t.album.images && t.album.images[0] && t.album.images[0].url) || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&q=80'
            });
          }
        }

        localStorage.setItem(CACHED_CRATES_KEY, JSON.stringify(crateStore));

        progressBar.style.width = '100%';
        progressPct.textContent = '100%';
        setTimeout(function() { progressContainer.classList.add('hidden'); }, 500);

        document.getElementById('librarySummaryBadge').textContent = items.length + ' Liked Tracks Sorted';
        renderCrates();

      } catch (err) {
        console.error(err);
        alert("Scan encountered an issue. Please try again.");
        progressContainer.classList.add('hidden');
      }
    }

    // Smooth Drawer System with Touch Slide-Out
    function openCrateDrawer(id) {
      activeDrawerCrateId = id;
      var crate = crateStore[id];
      if (!crate) return;

      document.getElementById('drawerCrateTitle').textContent = crate.name;
      document.getElementById('drawerCrateSub').textContent = (crate.tracks ? crate.tracks.length : 0) + ' tracks';

      var list = document.getElementById('drawerTrackList');
      list.innerHTML = '';

      if (!crate.tracks || !crate.tracks.length) {
        list.innerHTML = '<p class="text-xs text-slate-500 text-center py-10 italic">No tracks categorized in this crate.</p>';
      } else {
        for (var i = 0; i < crate.tracks.length; i++) {
          var track = crate.tracks[i];
          var row = document.createElement('div');
          row.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border border-deck-border hover:border-slate-600 cursor-pointer touch-press";
          row.setAttribute('data-url', track.preview_url || '');
          row.setAttribute('data-id', track.id);
          row.onclick = function() { 
            toggleTrackDemo(this.getAttribute('data-id'), this.getAttribute('data-url')); 
          };
          row.innerHTML = 
            '<div class="flex items-center gap-3 overflow-hidden flex-1">' +
              '<img src="' + track.image + '" class="w-9 h-9 rounded-lg object-cover bg-slate-800 flex-shrink-0" alt="art">' +
              '<div class="truncate">' +
                '<p class="text-xs font-bold text-white truncate leading-tight">' + track.name + '</p>' +
                '<p class="text-[10px] text-slate-400 truncate mt-0.5">' + track.artist + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-2">' +
              '<span id="playIcon-' + track.id + '" class="p-1.5 rounded-lg bg-slate-800 text-deck-green hover:bg-slate-700">' +
                '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>' +
              '</span>' +
              '<a href="https://open.spotify.com/track/' + track.id + '" target="_blank" onclick="event.stopPropagation()" class="p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white" title="Open in Spotify">' +
                '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>' +
              '</a>' +
            '</div>';
          list.appendChild(row);
        }
      }

      var backdrop = document.getElementById('crateDrawerBackdrop');
      var drawer = document.getElementById('crateDrawer');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      drawer.style.transform = 'translateY(0%)';
    }

    function closeCrateDrawer() {
      var backdrop = document.getElementById('crateDrawerBackdrop');
      var drawer = document.getElementById('crateDrawer');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
      drawer.style.transform = 'translateY(100%)';
      stopAudioDemo();
    }

    // Touch Swipe Gesture on Drawer Header
    var touchStartY = 0;
    var currentTranslateY = 0;
    var isDragging = false;

    var swipeArea = document.getElementById('drawerSwipeArea');
    var drawer = document.getElementById('crateDrawer');

    swipeArea.addEventListener('touchstart', function(e) {
      touchStartY = e.touches[0].clientY;
      isDragging = true;
      drawer.style.transition = 'none';
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var currentY = e.touches[0].clientY;
      var diffY = currentY - touchStartY;
      if (diffY > 0) {
        currentTranslateY = diffY;
        drawer.style.transform = 'translateY(' + diffY + 'px)';
      }
    }, { passive: true });

    window.addEventListener('touchend', function() {
      if (!isDragging) return;
      isDragging = false;
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
      if (currentTranslateY > 120) {
        closeCrateDrawer();
      } else {
        drawer.style.transform = 'translateY(0%)';
      }
      currentTranslateY = 0;
    });

    // Audio Demo Playback with Web Audio Synthesizer fallback
    function toggleTrackDemo(trackId, previewUrl) {
      if (currentPlayingId === trackId) {
        stopAudioDemo();
        return;
      }
      stopAudioDemo();
      currentPlayingId = trackId;

      var icon = document.getElementById('playIcon-' + trackId);
      if (icon) icon.innerHTML = '<svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

      var audio = document.getElementById('audioPlayer');
      if (previewUrl && previewUrl !== 'null' && previewUrl !== '') {
        audio.src = previewUrl;
        audio.play().catch(function() {
          playSynthesizerSequence();
        });
        audio.onended = function() { stopAudioDemo(); };
      } else {
        playSynthesizerSequence();
      }
    }

    function stopAudioDemo() {
      var audio = document.getElementById('audioPlayer');
      if (audio) {
        audio.pause();
        audio.src = '';
      }
      if (activeAudioNode) {
        try { activeAudioNode.stop(); } catch (e) {}
        activeAudioNode = null;
      }
      if (currentPlayingId) {
        var icon = document.getElementById('playIcon-' + currentPlayingId);
        if (icon) icon.innerHTML = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      }
      currentPlayingId = null;
    }

    function playSynthesizerSequence() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var notes = [261.63, 329.63, 392.00, 523.25];
        var time = ctx.currentTime;
        for (var n = 0; n < notes.length; n++) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(notes[n], time + (n * 0.18));
          gain.gain.setValueAtTime(0.2, time + (n * 0.18));
          gain.gain.exponentialRampToValueAtTime(0.001, time + (n * 0.18) + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(time + (n * 0.18));
          osc.stop(time + (n * 0.18) + 0.35);
        }
        setTimeout(function() {
          stopAudioDemo();
        }, 1200);
      } catch (e) {
        stopAudioDemo();
      }
    }

    // Export Playlists directly to user Spotify account
    function exportActiveDrawerCrate() {
      if (activeDrawerCrateId) exportSingleCrate(activeDrawerCrateId);
    }

    async function createAllSelectedPlaylists() {
      var selected = [];
      for (var i = 0; i < DJ_CRATES.length; i++) {
        var c = DJ_CRATES[i];
        if (crateStore[c.id] && crateStore[c.id].selected && crateStore[c.id].tracks && crateStore[c.id].tracks.length) {
          selected.push(c.id);
        }
      }
      if (!selected.length) {
        alert("Please select at least one crate containing tracks.");
        return;
      }
      for (var s = 0; s < selected.length; s++) {
        await exportSingleCrate(selected[s]);
      }
      alert("All selected playlists were successfully generated on Spotify!");
    }

    async function exportSingleCrate(crateId) {
      if (!accessToken) {
        toggleAuthModal();
        return;
      }
      var crate = crateStore[crateId];
      if (!crate || !crate.tracks || !crate.tracks.length) {
        alert("This crate is empty.");
        return;
      }

      var exportBtn = document.getElementById('drawerExportBtnText');
      if (exportBtn) exportBtn.textContent = "Creating...";

      try {
        // Direct modern endpoint: creates playlist under authenticated user without user ID lookup
        var plRes = await fetch('https://api.spotify.com/v1/me/playlists', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + accessToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: 'TrackSort - ' + crate.name,
            description: 'Subgenre crate generated with TrackSort.',
            public: false
          })
        });

        if (!plRes.ok) {
          var errData = await plRes.json();
          throw new Error(errData.error ? errData.error.message : 'Playlist creation forbidden');
        }

        var pl = await plRes.json();

        // Batch track URIs into groups of 50
        var uris = [];
        for (var u = 0; u < crate.tracks.length; u++) {
          if (crate.tracks[u] && crate.tracks[u].uri) uris.push(crate.tracks[u].uri);
        }

        for (var i = 0; i < uris.length; i += 50) {
          var chunk = uris.slice(i, i + 50);
          var addRes = await fetch('https://api.spotify.com/v1/playlists/' + pl.id + '/tracks', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + accessToken,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ uris: chunk })
          });
          if (!addRes.ok) throw new Error("Failed to insert tracks into playlist");
        }

        if (exportBtn) exportBtn.textContent = "Created ✓";
        alert('Playlist "TrackSort - ' + crate.name + '" (' + uris.length + ' tracks) created on Spotify!');
        setTimeout(function() {
          if (exportBtn) exportBtn.textContent = "Create Playlist";
        }, 2500);

      } catch (e) {
        console.error("Export error", e);
        if (exportBtn) exportBtn.textContent = "Create Playlist";
        alert("Spotify export error: " + e.message + "\n\nTry clicking 'Connect Spotify' to refresh permissions.");
      }
    }

    function generateRandomString(length) {
      var possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      var text = '';
      for (var i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
      return text;
    }

    async function generateCodeChallenge(verifier) {
      var encoder = new TextEncoder();
      var data = encoder.encode(verifier);
      var digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
    }

    // Startup Execution
    window.addEventListener('DOMContentLoaded', function() {
      try {
        var savedClientId = localStorage.getItem(CLIENT_ID_KEY) || '4c40070fe3c94db8e13c4bc587d6e7';
        var input = document.getElementById('clientIdInput');
        if (input) input.value = savedClientId;

        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        if (code) {
          history.replaceState(null, '', window.location.pathname);
          exchangeCodeForToken(code);
        }

        var cached = localStorage.getItem(CACHED_CRATES_KEY);
        if (cached) {
          try {
            crateStore = JSON.parse(cached);
            renderCrates();
            var badge = document.getElementById('librarySummaryBadge');
            if (badge) badge.textContent = 'Library Restored from Cache';
          } catch (e) {
            initEmptyStore();
          }
        } else {
          initEmptyStore();
        }
      } catch (err) {
        console.error("Safe startup caught:", err);
        initEmptyStore();
      }
    });
  </script>
